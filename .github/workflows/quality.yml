name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Structure, links, and Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository structure and catalog
        run: npm run validate

      - name: Lint Markdown
        run: npm run lint:md

      - name: Check internal links and anchors
        run: npm run check:links

      - name: Check spelling (non-blocking)
        run: npm run spellcheck
        continue-on-error: true
